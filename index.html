<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030432" />

    <!-- Tab icon: the studio monogram, cropped so the mark reads at 16px. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Nandan's Photography — Wedding Stories</title>
    <meta name="description" content="Nandan's Photography — wedding photography and films across India. Enquire for availability." />
    <!--
      Absolute URLs are required here. Relative paths are silently ignored by
      every scraper (WhatsApp, iMessage, Facebook, LinkedIn), which meant link
      previews rendered with no image at all — on WhatsApp, the studio's main
      channel. __SITE_URL__ is filled in at build time by vite.config.ts, so
      Vercel previews and the final domain both get correct absolute URLs.
      TODO: replace og:image with a real 1200x630 watermarked photograph once
      the client's finals arrive; the logo is a placeholder.
    -->
    <meta property="og:site_name" content="Nandan's Photography" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Nandan's Photography — Wedding photography across India" />
    <meta property="og:description" content="Warm, traditional wedding photography and films. Enquire for availability." />
    <meta property="og:image" content="__SITE_URL__/apple-touch-icon.png" />
    <meta property="og:image:width" content="180" />
    <meta property="og:image:height" content="180" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nandan's Photography — Wedding photography across India" />
    <meta name="twitter:description" content="Warm, traditional wedding photography and films. Enquire for availability." />
    <meta name="twitter:image" content="__SITE_URL__/apple-touch-icon.png" />
    <link rel="canonical" href="__SITE_URL__/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
